[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "content-workbench"
version = "0.1.3"
description = "Dongning Media Skill: collect sources and produce bilingual videos, image cards and WeChat articles with an AI assistant."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Content Workbench contributors"}]
dependencies = []

[project.optional-dependencies]
render = ["Pillow>=10.4,<14", "fonttools>=4.50,<5", "markdown-it-py>=3,<5", "tzdata>=2024.1"]
download = ["yt-dlp>=2026.10.21"]
asr = ["openai-whisper>=20240930"]

[project.scripts]
cwb = "content_workbench.cli:main"

[tool.setuptools.packages.find]
where = ["skills/content-workbench/scripts"]
include = ["content_workbench*"]

[tool.setuptools.package-data]
content_workbench = ["data/*.json", "data/*.txt"]
